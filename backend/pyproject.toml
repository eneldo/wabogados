[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "wabogados-backend"
version = "0.1.0"
description = "Backend base de WABOGADOS V1"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "anyio>=4.9,<5",
  "asyncpg>=0.30,<1",
  "boto3>=1.35,<2",
  # `argon2-cffi` hashes and verifies directly. It replaced `passlib`, which was
  # unmaintained, warned on import under Python 3.12 and used `crypt`, removed in
  # 3.13. The parameters are the defaults, which are the ones passlib used, so
  # existing hashes keep working; `test_password_hashing.py` freezes one to prove
  # it.
  "argon2-cffi>=23.1,<26",
  "email-validator>=2.2,<3",
  "fastapi>=0.116,<1",
  "pikepdf>=9.0,<10",
  "pillow>=11.0,<12",
  "pydantic[email]>=2.10,<3",
  "pydantic-settings>=2.10,<3",
  "python-jose[cryptography]>=3.3,<4",
  "python-multipart>=0.0.20,<1",
  # The rate limiter's shared counter. Declared because the limiter is useless
  # with several API workers otherwise: each one kept its own count, so the real
  # budget was `limit * workers`, and a restart handed everyone a fresh budget.
  # `slowapi` used to sit here and was never imported; the limiter is hand
  # written, see `services/rate_limit_store.py`.
  "redis>=5,<7",
  # Upper bounds are deliberate, not decoration. Each one marks a version whose
  # changes were measured against this codebase.
  #
  # - sqlalchemy 2.1 retypes `select(Model)` as `Select[Model]` and declares
  #   `Result.rowcount` as absent. The code was adapted rather than held back:
  #   the query helpers in `services/dashboard.py` are annotated `Select[Any]`
  #   (and `Select[Any, Any]` where two entities are selected), the one use of
  #   `rowcount` became `UPDATE ... RETURNING`, and `mypy` strict is clean on
  #   2.1.x. `mypy>=1.18` is what checked it.
  "sqlalchemy[asyncio]>=2.1,<2.2",
  # Without this the image builds, the whole suite passes, and the container
  # still cannot boot: nothing in the test suite imports uvicorn, so removing it
  # is invisible until `docker compose up` fails with "executable file not
  # found". It was removed by accident once, which is why it is named here.
  "uvicorn[standard]>=0.35,<2",
]


[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "moto[s3]>=5.0,<6",
  # `python-jose` and `passlib` ship no type information, so a clean environment
  # could not pass `mypy` strict without these. They were missing here, which
  # made the gate pass only on machines where the stubs happened to be
  # installed already.
  "types-passlib>=1.7,<2",
  "types-python-jose>=3.3,<4",
  # See the note on the sqlalchemy ceiling above before raising these.
  "mypy>=1.17,<1.18",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<0.13",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
asyncio_mode = "auto"
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
branch = true
source = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["app"]

[[tool.mypy.overrides]]
# boto3 and botocore ship no type information.
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true
